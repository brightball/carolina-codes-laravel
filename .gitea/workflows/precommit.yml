# First-stage prepare job clones GITHUB_SHA and installs PHP extensions,
# Composer, vendor/, and gitleaks once, then publishes that tree as a Gitea
# artifact. Check jobs restore it and run only their command. They do not
# re-clone, apt-get, or re-install.
#
# act_runner starts a new container per job, so jobs cannot share a live
# image. Host bind-mounts are also blocked (valid_volumes is empty).
# Empty php image: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not git init or set
# init.defaultBranch here. Do not use actions/checkout.
#
# Artifacts are uploaded with PHP cURL against Gitea's artifact API. The
# php:8.5-cli image has no Node (JS upload-artifact would fail) and the
# job token cannot publish OCI packages. The five checks need prepare
# only (not each other).
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  COMPOSER_ALLOW_SUPERUSER: "1"

# Shared restore step. Not a job. YAML anchor so check jobs do not each
# re-clone or composer-install; they download the prepared-env artifact.
x-restore-prepared-env: &restore-prepared-env
  run: |
    set -euo pipefail
    token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
    if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
    out=/tmp/ci-env.php
    api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-env.php?ref=${GITHUB_SHA}"
    if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out" || ! grep -q cmd_restore "$out"; then
      host="${GITHUB_SERVER_URL#https://}"
      host="${host#http://}"
      scheme=https
      case "${GITHUB_SERVER_URL}" in http://*) scheme=http ;; esac
      curl -fsSL "${scheme}://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-env.php" -o "$out"
    fi
    grep -q cmd_restore "$out"
    php /tmp/ci-env.php restore

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git unzip \
            libsqlite3-dev libxml2-dev libonig-dev libzip-dev $PHPIZE_DEPS
          docker-php-ext-install -j"$(nproc)" mbstring xml pdo_sqlite zip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: php scripts/ci-env.php prepare

  tests:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - *restore-prepared-env
      - run: php artisan test

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - *restore-prepared-env
      - run: vendor/bin/psalm --taint-analysis --no-cache --memory-limit=1G

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - *restore-prepared-env
      - run: composer audit --locked

  gitleaks:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: gitleaks detect --source .

  pint:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/php:8.5-cli
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - *restore-prepared-env
      - run: vendor/bin/pint --test
